user                            www;
worker_processes                auto; # it will be determinate automatically by the number of core

events {
    worker_connections          1024;
}

http {
    include                     /etc/nginx/mime.types;
    default_type                application/octet-stream;
    sendfile                    on;
    access_log                  /var/log/nginx/access.log;
    client_max_body_size 2G;
    server {
        listen 5000;
        server_name _;
        gzip on;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

        # OAuth discovery for the MCP's "sign in with Studio" (/api/mcp-oauth).
        # The issuer is .../api, so RFC 8414 puts its metadata at this
        # path-inserted address on the root; the resource fallback likewise.
        # Only these exact paths: every other /.well-known/* stays a 404
        # (apps/frontend/src/proxy.ts), which the key-in-URL connector relies on.
        location = /.well-known/oauth-authorization-server/api {
            proxy_pass http://localhost:3000/.well-known/oauth-authorization-server;
            proxy_set_header Host $host;
        }
        location = /.well-known/oauth-protected-resource/api/mcp-oauth {
            proxy_pass http://localhost:3000/.well-known/oauth-protected-resource;
            proxy_set_header Host $host;
        }
        # OpenAI's domain check for the ChatGPT apps directory (OPENAI_APP_CHALLANGE).
        location = /.well-known/openai-apps-challenge {
            proxy_pass http://localhost:3000/.well-known/openai-apps-challenge;
            proxy_set_header Host $host;
        }

        location /api/ {
            proxy_pass http://localhost:3000/;
            proxy_http_version 1.1;
            # Streamed responses (the agent chat) must reach the browser token by
            # token; with nginx's default buffering they arrive in lumps and the
            # chat looks frozen until the whole answer lands.
            proxy_buffering off;
            proxy_cache off;
            proxy_set_header Connection "";
            # A long answer can take minutes; the 60s default cuts it off.
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Reload $http_reload;
            proxy_set_header Onboarding $http_onboarding;
            proxy_set_header Activate $http_activate;
            proxy_set_header Auth $http_auth;
            proxy_set_header Showorg $http_showorg;
            proxy_set_header Impersonate $http_impersonate;
            proxy_set_header Accept-Language $http_accept_language;
        }

        location /uploads/ {
            alias /uploads/;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Content-Security-Policy "default-src 'none'; img-src 'self'; media-src 'self'; style-src 'none'; script-src 'none'; frame-ancestors 'none'; sandbox" always;
            types {
                image/jpeg jpg jpeg;
                image/png png;
                image/gif gif;
                image/webp webp;
                image/avif avif;
                image/bmp bmp;
                image/tiff tif tiff;
                video/mp4 mp4;
            }
            default_type application/octet-stream;
        }

        location / {
            proxy_pass http://localhost:4200/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Reload $http_reload;
            proxy_set_header Onboarding $http_onboarding;
            proxy_set_header Activate $http_activate;
            proxy_set_header Auth $http_auth;
            proxy_set_header Showorg $http_showorg;
            proxy_set_header Impersonate $http_impersonate;
            proxy_set_header Accept-Language $http_accept_language;
            proxy_set_header i18next $http_i18next;
        }
    }
}